<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Topple</title>
<style>
  :root { --u: 4px; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; overscroll-behavior: none; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    color: #fff;
  }

  #stage {
    position: relative; overflow: hidden; width: 360px; height: 640px;
    touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
    background: #101830;
  }
  #bg { position: absolute; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- in-game HUD ---------- */
  #hud { position: absolute; left: 0; right: 0; top: 0; text-align: center; pointer-events: none; transition: opacity .3s; }
  #score {
    margin-top: calc(var(--u) * 8);
    font-size: calc(var(--u) * 21); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 calc(var(--u) * .6) calc(var(--u) * 2.6) rgba(0,0,0,.4);
  }
  #score.pop { animation: pop .28s ease-out; }
  #best { margin-top: calc(var(--u) * 1.6); font-size: calc(var(--u) * 3.4); font-weight: 600; opacity: .65; }
  @keyframes pop { from { transform: scale(1.28); } to { transform: scale(1); } }

  #perfect {
    position: absolute; left: 0; right: 0; top: calc(var(--u) * 36);
    text-align: center; pointer-events: none; opacity: 0;
    font-size: calc(var(--u) * 7); font-weight: 800; font-style: italic;
    text-shadow: 0 calc(var(--u) * .6) calc(var(--u) * 2) rgba(0,0,0,.35);
  }
  #perfect.go { animation: perfect .9s ease-out; }
  @keyframes perfect {
    0%   { opacity: 0; transform: translateY(calc(var(--u) * 4)) scale(.82); }
    18%  { opacity: 1; transform: translateY(0) scale(1.06); }
    70%  { opacity: 1; transform: translateY(calc(var(--u) * -1.5)) scale(1); }
    100% { opacity: 0; transform: translateY(calc(var(--u) * -5)) scale(1); }
  }

  /* ---------- panels ---------- */
  .panel { position: absolute; inset: 0; opacity: 0; transition: opacity .35s; pointer-events: none; text-align: center; }
  .hero { position: absolute; left: 0; right: 0; }
  .hero h1 {
    margin: 0; font-size: calc(var(--u) * 21); font-weight: 900; line-height: .95; letter-spacing: -.02em;
    text-shadow: 0 calc(var(--u) * .8) calc(var(--u) * 3) rgba(0,0,0,.4);
  }
  .hero h2 {
    margin: 0; font-size: calc(var(--u) * 10.5); font-weight: 800; line-height: 1; letter-spacing: -.01em;
    text-shadow: 0 calc(var(--u) * .8) calc(var(--u) * 3) rgba(0,0,0,.5);
  }
  .hero p, #overBest { margin: calc(var(--u) * 2.4) 0 0; font-size: calc(var(--u) * 3.8); line-height: 1.4; opacity: .8; font-weight: 500; text-shadow: 0 1px calc(var(--u) * 1.5) rgba(0,0,0,.4); }
  #overBest { font-size: calc(var(--u) * 4.6); opacity: .95; font-weight: 700; }
  .cta {
    position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 11);
    font-size: calc(var(--u) * 4.6); font-weight: 700;
    animation: breathe 1.6s ease-in-out infinite;
    text-shadow: 0 1px calc(var(--u) * 2) rgba(0,0,0,.5);
  }
  @keyframes breathe { 50% { opacity: .4; } }

  #stage.ready #title, #stage.over #over { opacity: 1; }
  #stage.ready #hud { opacity: 0; }

  #tag {
    position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 3.2); text-align: center;
    font-size: calc(var(--u) * 2.8); font-weight: 600; opacity: 0; pointer-events: none;
  }
  #tag.show { opacity: .5; }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 10%; text-align: center; font-size: calc(var(--u) * 4); line-height: 1.4; }
  #msg.show { display: flex; }

  @media (prefers-reduced-motion: reduce) {
    .cta { animation: none; }
    #perfect.go { animation-duration: 1.2s; }
  }
</style>
</head>
<body>
<div id="stage" class="ready">
  <div id="bg"></div>
  <div id="hud">
    <div id="score">0</div>
    <div id="best">Best 0</div>
  </div>
  <div id="perfect"></div>

  <div id="title" class="panel">
    <div class="hero" style="top: calc(var(--u) * 20);">
      <h1>Topple</h1>
      <p>Drop each block onto the last one.<br>Whatever overhangs gets sliced off.</p>
    </div>
    <div class="cta" id="ctaStart">Tap to start</div>
  </div>

  <div id="over" class="panel">
    <div class="hero" style="bottom: calc(var(--u) * 27);">
      <h2>Game over</h2>
      <div id="overBest"></div>
    </div>
    <div class="cta" id="ctaOver">Tap to retry</div>
  </div>

  <div id="tag">Autoplay</div>
  <div id="flash"></div>
  <div id="msg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), bgEl = $('bg'), scoreEl = $('score'), bestEl = $('best'),
        perfectEl = $('perfect'), overBestEl = $('overBest'), ctaStart = $('ctaStart'),
        ctaOver = $('ctaOver'), tagEl = $('tag'), flashEl = $('flash'), msgEl = $('msg');

  if (typeof THREE === 'undefined') {
    msgEl.textContent = 'Three.js could not be loaded. Check your connection and reload.';
    msgEl.classList.add('show');
    return;
  }

  // ------------------------------------------------------------------ params
  const qs = new URLSearchParams(location.search);
  const AUTO = ['1', 'true', 'yes'].indexOf((qs.get('autoplay') || '').toLowerCase()) !== -1;
  const SEED = qs.get('seed');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashSeed(s) {
    let h = 2166136261 >>> 0;
    s = String(s);
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  const rng = SEED !== null ? mulberry32(hashSeed(SEED)) : Math.random;

  // ------------------------------------------------------------------ tuning
  const H = 1;               // block height
  const START = 10;          // starting block width/depth, also the max size
  const R = 12.5;            // slide range either side of the block below
  const PERFECT = 0.5;       // |offset| under this snaps clean
  const GROW = 0.5;          // size regained per perfect once on a streak
  const GROW_AT = 3;         // streak length that starts regrowing
  const MIN_OVERLAP = 0.08;  // less than this counts as a miss
  const V0 = 9, DV = 0.13, VMAX = 18;   // slide speed, units per second
  const VIEW_W = 24, VIEW_H = VIEW_W * 16 / 9;
  const ISO = 0.8165;        // vertical scale of the isometric camera

  // ------------------------------------------------------------------ renderer / scene
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
  stage.insertBefore(renderer.domElement, $('hud'));

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-VIEW_W / 2, VIEW_W / 2, VIEW_H / 2, -VIEW_H / 2, -300, 600);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(20, 50, 35);
  scene.add(sun);

  const BOX = new THREE.BoxGeometry(1, 1, 1);

  function resize() {
    const W = window.innerWidth, Hh = window.innerHeight;
    let w = Hh * 9 / 16, h = Hh;
    if (w > W) { w = W; h = W * 16 / 9; }
    w = Math.floor(w); h = Math.floor(h);
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    document.documentElement.style.setProperty('--u', (w / 100) + 'px');
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
  }
  window.addEventListener('resize', resize);
  resize();

  // ------------------------------------------------------------------ colour
  const hueFor = (i) => 208 + i * 4.2;   // unwrapped degrees, shifts as the tower climbs
  function blockColor(i) {
    return new THREE.Color().setHSL((((hueFor(i) % 360) + 360) % 360) / 360, 0.62, 0.62);
  }
  let bgHue = hueFor(0), lastPainted = -999;
  function paintBg() {
    if (Math.abs(bgHue - lastPainted) < 0.15) return;
    lastPainted = bgHue;
    const h = bgHue;
    bgEl.style.background =
      'linear-gradient(180deg, hsl(' + (h - 10).toFixed(1) + ',48%,14%) 0%, hsl(' +
      (h + 4).toFixed(1) + ',50%,24%) 55%, hsl(' + (h + 24).toFixed(1) + ',56%,36%) 100%)';
  }

  // ------------------------------------------------------------------ audio
  let AC = null;
  function initAudio() {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
  }
  function tone(f, d, type, v, f2) {
    if (!AC || AC.state !== 'running') return;
    try {
      const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + d + 0.02);
    } catch (e) { /* audio is optional */ }
  }
  const SCALE = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2, 9 / 4, 5 / 2];

  // ------------------------------------------------------------------ state
  let state = 'ready';            // ready | playing | over
  let clock = 0, overAt = 0, autoT = 0;
  let tower = [];                 // placed blocks; [0] is the base
  let cur = null;                 // block that is sliding
  let pieces = [], rings = [];
  let combo = 0, plan = null, missAt = 25;
  let camY = 7, lx = 0, lz = 0, zoom = 1;

  function loadBest() { try { return parseInt(localStorage.getItem('topple.best'), 10) || 0; } catch (e) { return 0; } }
  function saveBest() { if (AUTO) return; try { localStorage.setItem('topple.best', String(best)); } catch (e) { /* ignore */ } }
  let best = AUTO ? 0 : loadBest();
  let newBest = false;

  function setState(s) { state = s; stage.className = s; }
  function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function setScore(n) { scoreEl.textContent = String(n); retrigger(scoreEl, 'pop'); }
  function setBestText() { bestEl.textContent = 'Best ' + best; }
  function flash() {
    flashEl.style.transition = 'none'; flashEl.style.opacity = '0.5';
    void flashEl.offsetWidth;
    flashEl.style.transition = 'opacity .5s'; flashEl.style.opacity = '0';
  }

  // ------------------------------------------------------------------ blocks
  function makeMesh(sx, sz, color) {
    const m = new THREE.Mesh(BOX, new THREE.MeshLambertMaterial({ color: color }));
    m.scale.set(sx, H, sz);
    return m;
  }
  function disposeMesh(m) { scene.remove(m); if (m.material) m.material.dispose(); }

  function reset() {
    tower.forEach((t) => disposeMesh(t.mesh));
    if (cur) disposeMesh(cur.mesh);
    pieces.forEach((p) => disposeMesh(p.mesh));
    rings.forEach((r) => disposeMesh(r.m));
    tower = []; pieces = []; rings = []; cur = null; plan = null; combo = 0; newBest = false;
    missAt = 24 + Math.floor(rng() * 3);     // the drop that autoplay will fluff: floor 24-26

    const base = makeMesh(START, START, blockColor(0));
    base.scale.set(START, 1000, START);       // a very tall column so the bottom never shows
    base.position.set(0, -500, 0);
    scene.add(base);
    tower.push({ c: { x: 0, z: 0 }, s: { x: START, z: START }, mesh: base });

    camY = 7; lx = 0; lz = 0; zoom = 1;
    bgHue = hueFor(0);
    scoreEl.textContent = '0';
    setBestText();
    spawn();
  }

  function spawn() {
    const top = tower[tower.length - 1];
    const i = tower.length;                   // floor number this block will become
    const a = (i % 2 === 1) ? 'x' : 'z';      // axis alternates every floor
    const side = rng() < 0.5 ? -1 : 1;
    const mesh = makeMesh(top.s.x, top.s.z, blockColor(i));
    mesh.position.y = (i - 0.5) * H;
    cur = { i: i, a: a, o: side * R, dir: -side, base: top.c[a],
            c: { x: top.c.x, z: top.c.z }, s: { x: top.s.x, z: top.s.z }, mesh: mesh };
    syncCur();
    scene.add(mesh);
    plan = AUTO ? makePlan() : null;
  }

  function syncCur() {
    const a = cur.a, b = a === 'x' ? 'z' : 'x';
    cur.mesh.position[a] = cur.base + cur.o;
    cur.mesh.position[b] = cur.c[b];
  }

  function speed() { return Math.min(VMAX, V0 + (tower.length - 1) * DV); }

  // ------------------------------------------------------------------ autoplay "player"
  // Picks the offset (relative to the block below) at which it will tap.
  // Mostly within the perfect window, sometimes a little off, and one clean miss near floor 25.
  function makePlan() {
    const n = tower.length;                    // floor being attempted
    const w = cur.s[cur.a];
    const sign = rng() < 0.5 ? -1 : 1;
    if (n === missAt) {
      return sign * Math.min(R - 0.4, w + 0.5 + rng() * 1.0);       // lands fully beside the tower
    }
    if (rng() < 0.2) {
      return sign * Math.min(0.55 + rng() * 1.0, w * 0.45);         // slightly off, never fatal
    }
    return (rng() + rng() - 1) * 0.38;                              // clean, inside the perfect window
  }

  // ------------------------------------------------------------------ dropping
  function place() {
    if (!cur || state !== 'playing') return;
    const top = tower[tower.length - 1];
    const a = cur.a, b = a === 'x' ? 'z' : 'x';
    const o = cur.o;
    const ps = top.s[a], cs = cur.s[a];
    const pc = top.c[a], cc = pc + o;
    const left = Math.max(pc - ps / 2, cc - cs / 2);
    const right = Math.min(pc + ps / 2, cc + cs / 2);
    const overlap = right - left;

    if (overlap < MIN_OVERLAP) { gameOver(); return; }

    const c = { x: top.c.x, z: top.c.z };
    const s = { x: top.s.x, z: top.s.z };
    const y = (cur.i - 0.5) * H;
    const perfect = Math.abs(o) < PERFECT;

    if (perfect) {
      combo++;
      c[a] = pc;
      s[a] = cs;
      if (combo >= GROW_AT) s[a] = Math.min(START, s[a] + GROW);
      addRing(c, s, y);
      showPerfect(combo);
      const f = 392 * SCALE[Math.min(combo - 1, SCALE.length - 1)];
      tone(f, 0.4, 'triangle', 0.22); tone(f * 2, 0.4, 'sine', 0.07);
    } else {
      combo = 0;
      c[a] = (left + right) / 2;
      s[a] = overlap;
      // the overhang
      let os, oc;
      if (cc > pc) { os = (cc + cs / 2) - right; oc = right + os / 2; }
      else         { os = left - (cc - cs / 2);  oc = left - os / 2; }
      const dSize = { x: 0, z: 0 }, dCtr = { x: 0, z: 0 };
      dSize[a] = os;      dCtr[a] = oc;
      dSize[b] = cur.s[b]; dCtr[b] = cur.c[b];
      const piece = makeMesh(dSize.x, dSize.z, blockColor(cur.i));
      piece.position.set(dCtr.x, y, dCtr.z);
      scene.add(piece);
      throwPiece(piece, a, cc > pc ? 1 : -1, 2.5);
      tone(170, 0.14, 'sine', 0.3, 80);
      tone(300, 0.1, 'triangle', 0.08, 140);
    }
    if (perfect) tone(150, 0.12, 'sine', 0.25, 80);

    cur.mesh.scale.set(s.x, H, s.z);
    cur.mesh.position.set(c.x, y, c.z);
    tower.push({ c: c, s: s, mesh: cur.mesh });
    cur = null;

    const score = tower.length - 1;
    setScore(score);
    if (score > best) { best = score; newBest = true; setBestText(); }
    spawn();
  }

  function throwPiece(mesh, axis, dirSign, push) {
    const v = { x: 0, y: 0, z: 0 }, w = { x: 0, y: 0, z: 0 };
    v[axis] = dirSign * push;
    if (axis === 'x') w.z = -dirSign * 1.7; else w.x = dirSign * 1.7;
    pieces.push({ mesh: mesh, v: v, w: w });
  }

  function addRing(c, s, y) {
    const m = new THREE.Mesh(BOX, new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }));
    m.position.set(c.x, y, c.z);
    m.scale.set(s.x, H, s.z);
    scene.add(m);
    rings.push({ m: m, t: 0, sx: s.x, sz: s.z });
  }

  function showPerfect(n) {
    perfectEl.textContent = n >= 2 ? 'Perfect \u00d7' + n : 'Perfect';
    retrigger(perfectEl, 'go');
  }

  function gameOver() {
    setState('over');
    overAt = clock; autoT = 0;
    const a = cur.a;
    throwPiece(cur.mesh, a, cur.o >= 0 ? 1 : -1, 3);
    cur = null; plan = null;
    if (newBest) saveBest();
    const score = tower.length - 1;
    overBestEl.textContent = newBest && score > 0 ? 'New best: ' + score : 'Score ' + score + '  \u00b7  Best ' + best;
    tone(220, 0.6, 'sawtooth', 0.16, 50);
  }

  // ------------------------------------------------------------------ input
  function startGame() {
    setState('playing');
    autoT = 0;
  }
  function act() {
    if (state === 'ready') startGame();
    else if (state === 'playing') place();
    else if (state === 'over' && clock - overAt > 0.45) { flash(); reset(); startGame(); }
  }
  function onPointer(e) {
    if (e && e.preventDefault) e.preventDefault();
    initAudio();
    if (!AUTO) act();
  }
  window.addEventListener('pointerdown', onPointer);
  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown') {
      e.preventDefault();
      initAudio();
      if (!AUTO) act();
    }
  });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ------------------------------------------------------------------ frame step
  function moveCur(dt) {
    const v = state === 'ready' ? 6 : speed();
    const prev = cur.o;
    let raw = prev + cur.dir * v * dt;

    // autoplay: tap exactly where the plan says, even if that falls between two frames
    if (AUTO && state === 'playing' && plan !== null && (prev - plan) * (raw - plan) <= 0) {
      cur.o = plan; syncCur(); place();
      return;
    }
    if (raw > R)       { raw = 2 * R - raw;  cur.dir = -1; }
    else if (raw < -R) { raw = -2 * R - raw; cur.dir = 1; }
    cur.o = raw;
    syncCur();
  }

  function step(dt) {
    clock += dt;

    if (AUTO) {
      if (state === 'ready') { autoT += dt; if (autoT > 0.9) startGame(); }
      else if (state === 'over') { autoT += dt; if (autoT > 2.6) { flash(); reset(); startGame(); } }
    }

    if (cur && state !== 'over') moveCur(dt);

    // falling slices
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i], m = p.mesh;
      p.v.y -= 40 * dt;
      m.position.x += p.v.x * dt; m.position.y += p.v.y * dt; m.position.z += p.v.z * dt;
      m.rotation.x += p.w.x * dt; m.rotation.z += p.w.z * dt;
      if (m.position.y < camY - 150) { disposeMesh(m); pieces.splice(i, 1); }
    }
    // perfect pulses
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.t += dt;
      const k = r.t / 0.5;
      if (k >= 1) { disposeMesh(r.m); rings.splice(i, 1); continue; }
      const g = 1 + 0.32 * k;
      r.m.scale.set(r.sx * g, H * (1 + 0.1 * k), r.sz * g);
      r.m.material.opacity = 0.55 * (1 - k);
    }

    // camera
    const top = tower[tower.length - 1];
    const topY = (tower.length - 1) * H;
    let gy, gz, gx, gzoom;
    if (state === 'over') {
      gy = topY * 0.5 + 2;
      gzoom = Math.min(1, Math.max(0.28, (VIEW_H * 0.8) / (topY * ISO + 18)));
      gx = top.c.x * 0.5; gz = top.c.z * 0.5;
    } else {
      gy = topY + 7; gzoom = 1; gx = top.c.x; gz = top.c.z;
    }
    const k = 1 - Math.exp(-dt * 3);
    camY += (gy - camY) * k; zoom += (gzoom - zoom) * k;
    lx += (gx - lx) * k * 0.7; lz += (gz - lz) * k * 0.7;
    camera.zoom = zoom;
    camera.position.set(lx + 30, camY + 30, lz + 30);
    camera.lookAt(lx, camY, lz);
    camera.updateProjectionMatrix();

    // background follows the tower's hue
    bgHue += (hueFor(tower.length - 1) - bgHue) * (1 - Math.exp(-dt * 2));
    paintBg();
  }

  let last = null;
  function frame(t) {
    const dt = last === null ? 0.016 : Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t;
    step(dt);
    renderer.render(scene, camera);
    window.requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ go
  if (AUTO) {
    tagEl.classList.add('show');
    ctaStart.textContent = 'Playing itself';
    ctaOver.textContent = 'Restarting\u2026';
  }
  reset();
  setState('ready');
  window.TOPPLE = { state: function () { return state; }, score: function () { return tower.length - 1; }, auto: AUTO };
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
